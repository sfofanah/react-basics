<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4b Exercises</title>
    <style>
      body {
        font-family: Arial;
      }

      .title {
        font-size: 25px;
      }

      .login-button {
        background-color: rgb(0, 123, 255);
        color: white;
        margin-right: 5px;
        margin-top: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .login-input {
        margin-bottom: 10px;
        border-radius: 5px;
        border-width: 1px;
        width: 200px;
      }

      .show-button {
        margin-left: 10px;;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React External Libary to use for our website (Need Both) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Sets up react after getting the external libraries above -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function Introduction({ message }) {
        return (
          <p className="title">
            {message}
          </p>
        );
      }

      function LoginForm() {
        const [showPassword, setShowPassword] = React.useState(false);

        function toggleShowPassword() {
            if (showPassword) {
              setShowPassword(false);
            } else {
              setShowPassword(true);
            }
        // setShowPassword(!showPassword); <-- another solution for this function
        }
        
        return (
          <>
            <div>
              <input 
                placeholder="Email"
                className="login-input"
              />
            </div>
            <div>
              <input 
                placeholder="Password" 
                type={showPassword ? 'text' : 'password'} 
                className="login-input"
              />
              <button 
                className="show-button"
                onClick={toggleShowPassword}
              >
                {showPassword ? 'Hide' : 'Show'}
              </button>
            </div>
            <button className="login-button">Login</button>
            <button className="login-button">Sign up</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <Introduction 
              message="Hello, welcome to my website" 
            />
            <LoginForm />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
