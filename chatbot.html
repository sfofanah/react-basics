<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React External Libary to use for our website (Need Both) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!-- Sets up react after getting the external libraries above -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      // Creating a component (Always Uppercase letter & can only return one element) (fragment)
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage () {
          if (isLoading || inputText === '') {
            return;
          }
          
          setIsLoading(true);

          setInputText('');

          const newChatMessages = [
            ...chatMessages, 
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];
          
          setChatMessages([
            ...newChatMessages, 
            {
              message: 'Loading...',
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          const response = await Chatbot.getResponseAsync(inputText);
              setChatMessages([
              ...newChatMessages, 
              {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);

            setIsLoading(false);
          }

          function handleKeyDown(event) {
            if (event.key === 'Enter') {
              sendMessage();
            } else if (event.key === 'Escape') {
              setInputText('');
            }
          }

        return (
          <>
            <input 
              placeholder = "Send a message to Chatbot" 
              size = "30" 
              onChange = {saveInputText}
              value = {inputText}
              onKeyDown = {handleKeyDown}
            />
            <button
              onClick = {sendMessage}
            >Send</button>
          </>
        );
      }

      // Creating a component for the user & chatbot messages (used props - message & sender)
      function ChatMessage({ message, sender }) {
       // const message = props.message;
       // const sender = props.sender;
       // const { message, sender } = props; 
       /*
        if (sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50" />
              {message}    
            </div>
          );
        }
      */

        return (
          <div>
            {sender === 'robot' && (
              <img src="robot.png" width="50" />
            )}
            {message}
            {sender === 'user' && (
              <img src="user.png" width="50" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        return (
          <>
            {chatMessages.map((chatMessage) => {
                return (
                  <ChatMessage 
                    message = {chatMessage.message}
                    sender = {chatMessage.sender}
                    key = {chatMessage.id}
                  />
                );
              })}
          </>
        );

      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([{
          message: 'hello chat',
          sender: 'user',
          id: 'id1'
        },{
          message: 'Hello! How can I help you?',
          sender: 'robot',
          id: 'id2'
        },{
          message: 'What is today date?',
          sender: 'user',
          id: 'id3'
        },{
          message: 'Today is September 16',
          sender: 'robot',
          id: 'id4'
        }]);
        // const [chatMessages, setChatMessages] = array;
        // const chatMessages = array[0];
        // const setChatMessages = array[1];

        return (
          <>
            <ChatInput 
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages}
            />
            <ChatMessages 
              chatMessages = {chatMessages}
            />
          </>
        );
      }

      // Can use a div element to render and display multiple html elements (Used fragment - empty div)
  
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
