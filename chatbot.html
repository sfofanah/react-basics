<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React External Libary to use for our website (Need Both) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Sets up react after getting the external libraries above -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      // Creating a component (Always Uppercase letter & can only return one element) (fragment)
      function ChatInput() {
        return (
          <>
            <input 
              placeholder="Send a message to Chatbot" 
              size="30" 
            />
            <button>Send</button>
          </>
        );
      }

      // Creating a component for the user & chatbot messages (used props - message & sender)
      function ChatMessage({ message, sender }) {
       // const message = props.message;
       // const sender = props.sender;
       // const { message, sender } = props;
        
       /*
        if (sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50" />
              {message}    
            </div>
          );
        }
      */

        return (
          <div>
            {sender === 'robot' && (
              <img src="robot.png" width="50" />
            )}
            {message}
            {sender === 'user' && (
              <img src="user.png" width="50" />
            )}
          </div>
        );
      }

      function App() {
        const chatMessages = [{
          message: 'hello chat',
          sender: 'user'
        },{
          message: 'Hello! How can I help you?',
          sender: 'robot'
        },{
          message: 'What is today date?',
          sender: 'user'
        },{
          message: 'Today is September 16',
          sender: 'robot'
        }];

        return (
          <>
            <ChatInput />
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message = {chatMessage.message}
                  sender = {chatMessage.sender}
                />
              );
            })}
          </>
        );
      }

      // Can use a div element to render and display multiple html elements (Used fragment - empty div)
  
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
