<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 3b Exercises</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React External Libary to use for our website (Need Both) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Sets up react after getting the external libraries above -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function Inputs({ input, setInput }) {
        
        function OnChageHandler(event) {
          setInput(event.target.value);
        }

        return (
          <input
            onChange = {OnChageHandler}
            placeholder = "Type anything"
            value = {input}
          />
        )
      }

     
      function App() {
        const [input, setInput] = React.useState('');

        function ResetButton() {
          setInput('');
        }

        function ExampleButton() {
          setInput('Alice');
        }

        return (
          <>
            <Inputs 
              input = {input}
              setInput = {setInput}
            />
            <button onClick = {ResetButton}>
              Reset
            </button>
            <button onClick = {ExampleButton}>
              Example
            </button>
            <p>Hello {input}</p>
          </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
