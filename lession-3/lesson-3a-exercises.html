<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 3a Exercises</title>
    <style>
      body {
        margin-top: 0;
        margin-bottom: 0;
      }
      
      .button-container {
        background-color: rgb(222, 222, 222);
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 0px;
        margin-bottom: 0px;
        height: 100vh;
      }

      .btn-button {
        background-color: rgb(25, 135, 84);
        padding: 10px 15px;
        color: white;
        margin-right: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React External Libary to use for our website (Need Both) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Sets up react after getting the external libraries above -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function App() {
        const [count, setCount] = React.useState(0);
        const buttonRef = React.useRef();

        function increaseCount() {
          setCount(count + 1);
        }

        function resetCount() {
          setCount(0);
        }

        function autoClicks() {
          setInterval(() => {
            const buttonElem = buttonRef.current;
            if (buttonElem) {
              buttonElem.click();
            }
          }, 1000)
        }

          return (
          <div className="button-container">
            <button 
              onClick={increaseCount}
              ref={buttonRef}
              className="btn-button"
            >
              Clicked {count} {count === 1 ? 'time' : 'times'}
            </button>
            <button 
              onClick={resetCount}
              className="btn-button"
            >
              Reset
            </button>
            <button 
              onClick={autoClicks}
              className="btn-button"
            >
              Auto Click
            </button>
          </div>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
